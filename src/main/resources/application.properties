# Port - matches old Typescript BFF default
quarkus.http.port=9005

# process-vah base URL — must not include a trailing slash
quarkus.rest-client.process-vah.url=${PROCESS_VAH_URL:http://localhost:8080}

# Index the generated process contract so the REST client can extend its interface
quarkus.index-dependency.process-openapi.group-id=se.fk.rimfrost.framework.process
quarkus.index-dependency.process-openapi.artifact-id=rimfrost-framework-process-openapi-jaxrs-spec

# Optional contract fields (e.g. ProcessSteg.beskrivning) are left out instead of sent as null
quarkus.jackson.serialization-inclusion=non_null

# CORS - allow the frontend to call this BFF
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3030}
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Off by default — enable per environment if the frontend needs to send cookies cross-origin
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Container image
quarkus.container-image.build=true
quarkus.container-image.name=rimfrost-process-vah-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
